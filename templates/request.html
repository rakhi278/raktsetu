{% extends "base.html" %}
{% block title %}Request Blood{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:820px">
  <h2>Request blood</h2>
  <p class="text-secondary">Fill in the patient details. The request will appear on the Blood Requests page.</p>
  <form method="post" class="row g-3 needs-validation" novalidate>
    <div class="col-md-6"><label class="form-label">Patient name</label><input class="form-control" name="patient" required minlength="3" value="{{ f.get('patient','') }}"></div>
    <div class="col-md-6"><label class="form-label">Required blood group</label>
      <select class="form-select" name="bg" required><option value="">Select</option>{% for b in BLOOD_GROUPS %}<option {{ 'selected' if f.get('bg')==b }}>{{ b }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Hospital name</label><input class="form-control" name="hospital" required value="{{ f.get('hospital','') }}"></div>
    <div class="col-md-6"><label class="form-label">City / location</label><input class="form-control" name="city" list="cities" required value="{{ f.get('city','') }}"></div>
    <div class="col-md-4"><label class="form-label">Units required</label><input class="form-control" name="units" type="number" min="1" max="20" required value="{{ f.get('units','1') }}"></div>
    <div class="col-md-4"><label class="form-label">Contact number</label><input class="form-control" name="phone" type="tel" pattern="[0-9]{10}" placeholder="10 digit number" required value="{{ f.get('phone','') }}"></div>
    <div class="col-md-4"><label class="form-label">Urgency</label>
      <select class="form-select" name="urgency">{% for u in URGENCY %}<option {{ 'selected' if f.get('urgency')==u }}>{{ u }}</option>{% endfor %}</select></div>
    <div class="col-12"><button class="btn btn-rs" type="submit">Submit request</button></div>
  </form>
</div>
{% endblock %}
